[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tells"
version = "1.0.0"
description = "Multi-signal evasive behavior detection via Chrome DevTools Protocol"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "pydantic>=2.6",
    # core/reasoning.py imports boto3 at module level, so it is a HARD dependency, not an
    # extra. Declared as such to match the six other cloud-using projects in the portfolio.
    # Without it the package installs and then fails to import, which is the worst of both.
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
tells = "evasion_detect.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]

[tool.ruff.lint.per-file-ignores]
# reasoning.py holds the system prompt; the others hold log f-strings and fixture text.
"src/evasion_detect/core/reasoning.py" = ["E501"]
"src/evasion_detect/core/brief.py" = ["E501"]
"src/evasion_detect/cli.py" = ["E501"]
"tests/unit/test_brief.py" = ["E501"]

[tool.hatch.build.targets.wheel]
# The distribution is named "tells" but the import package keeps its original name, so hatchling
# cannot find it by name and must be told where it is.
packages = ["src/evasion_detect"]
